<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <h2 class="text-center my-5">Product Management Deployed</h2>

        <div class="d-flex align-items-center justify-content-between mb-4">
            <!-- Search container -->
            <div class="d-flex gap-3 align-items-center position-relative" style="width: 500px;">
                <input type="text" id="search" class="w-100 py-2 px-3 rounded-5">
                <button class="btn btn-success rounded-5 position-absolute end-0 py-2">Search</button>
            </div>

            <div>
                <label for="">Category: </label>
                <select name="" id="category">
                    
                </select>
            </div>

            <button 
                data-bs-toggle="modal"
                data-bs-target="#productModal"
                onclick="openAddModal()"
                class="btn btn-success">Add product</button>
        </div>

        <table class="table table-bordered">
            <thead>
                <tr class="text-center">
                    <th>Name</th>
                    <th>Code</th>
                    <th>Price</th>
                    <th>QTY</th>
                    <th>Category</th>
                    <th>Image</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="show-products">
                
            </tbody>
        </table>
    </div>

    <!-- Product modal -->
    <div class="modal" id="productModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Modal title</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form action="" id="form">
                    <div class="my-3">
                        <label for="" class="form-label">Name: </label>
                        <input type="text" id="name" class="form-control">
                    </div>

                    <div class="my-3">
                        <label for="" class="form-label">Name: </label>
                        <input type="text" id="code" class="form-control">
                    </div>

                    <div class="d-flex gap-4">
                        <div>
                            <label for="" class="form-label">Price: </label>
                            <input type="number" id="price" class="form-control">
                        </div>
                        
                        <div>
                            <label for="" class="form-label">QTY: </label>
                            <input type="number" id="qty" class="form-control">
                        </div>
                    </div>


                    <div class="my-3">
                        <img class="w-100" src="" id="previews-image" alt="">
                    </div>

                    <div class="my-3">
                        <label for="" class="form-label">Image: </label>
                        <input type="text" id="image" class="form-control">
                    </div>

                     <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="submit" id="save-btn" class="btn btn-primary" data-bs-dismiss="modal">Save changes</button>
                    </div>
                </form>
            </div>
            </div>
        </div>
    </div>

    <script src="array2.js"></script>
</body>
</html>
